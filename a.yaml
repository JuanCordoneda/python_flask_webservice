        },
        "TIE_NUMERO": {
          "type": "integer",
          "description": "El número TIE de la entidad"
        },
        "DESCRIPCION": {
          "type": "string",
          "description": "La descripción de la entidad"
        },
        "NUMERO_FIID": {
          "type": "string",
          "description": "El número FIID de la entidad"
        },
        "NUMERO_TSYS_EMI": {
          "type": "string",
          "description": "El número TSYS EMI de la entidad",
          "nullable": true
        },
        "NUMERO_TSYS_ADQ": {
          "type": "string",
          "description": "El número TSYS ADQ de la entidad",
          "nullable": true
        },
        "DESC_VENTAS": {
          "type": "string",
          "description": "La descripción de ventas de la entidad",
          "nullable": true
        },
        "DESC_PAGOS": {
          "type": "string",
          "description": "La descripción de pagos de la entidad",
          "nullable": true
        },
        "NUMERO_LN": {
          "type": "string",
          "description": "El número LN de la entidad",
          "nullable": true
        },
        "GCO_NUMERO": {
          "type": "number",
          "format": "float",
          "description": "El número GCO de la entidad",
          "nullable": true
        },
        "ID_UNICO_CARNET": {
          "type": "string",
          "description": "El ID único CARNET de la entidad",
          "nullable": true
        },
        "TRANSCOD": {
          "type": "number",
          "format": "float",
          "description": "El TRANSCOD de la entidad",
          "nullable": true
        },
        "CAMARA": {
          "type": "integer",
          "description": "La cámara de la entidad"
        },
        "ID_BANXICO": {
          "type": "number",
          "format": "float",
          "description": "El ID BANXICO de la entidad",
          "nullable": true
        },
        "ENV_BANXICO": {
          "type": "number",
          "format": "float",
