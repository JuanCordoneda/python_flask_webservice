{
  "swagger": "2.0",
  "info": {
    "description": "Colección para interactuar con la API de Entidades",
    "version": "1.0.0",
    "title": "Entidades API",
    "contact": {
      "email": "tuemail@dominio.com"
    }
  },
  "host": "127.0.0.1:5000",
  "basePath": "/api",
  "tags": [
    {
      "name": "entidades",
      "description": "Operaciones relacionadas con entidades"
    }
  ],
  "schemes": [
    "http"
  ],
  "paths": {
    "/entidades": {
      "get": {
        "tags": [
          "entidades"
        ],
        "summary": "Obtener todas las entidades",
        "description": "Obtiene una lista de todas las entidades",
        "produces": [
          "application/json"
        ],
        "responses": {
          "200": {
            "description": "Lista de entidades",
            "schema": {
              "type": "array",
              "items": {
                "$ref": "#/definitions/Entidad"
              }
            }
          }
        }
      },
      "post": {
        "tags": [
          "entidades"
        ],
        "summary": "Crear una nueva entidad",
        "description": "Crea una nueva entidad con los datos proporcionados",
        "consumes": [
          "application/json"
        ],
        "produces": [
          "application/json"
        ],
        "parameters": [
          {
            "in": "body",
            "name": "body",
            "description": "Entidad a ser creada",
            "required": true,
            "schema": {
              "$ref": "#/definitions/Entidad"
            }
          }
        ],
        "responses": {
          "201": {
            "description": "Entidad creada",
            "schema": {
              "$ref": "#/definitions/Entidad"
            }
          }
        }
      }
    },
    "/entidades/{entidad_id}": {
      "delete": {
        "tags": [
          "entidades"
        ],
        "summary": "Eliminar una entidad",
        "description": "Elimina una entidad por su ID",
        "produces": [
          "application/json"
        ],
        "parameters": [
          {
            "name": "entidad_id",
            "in": "path",
            "required": true,
            "type": "integer",
            "description": "ID de la entidad a eliminar"
          }
        ],
        "responses": {
          "200": {
            "description": "Entidad eliminada correctamente"
          },
          "404": {
            "description": "Entidad no encontrada"
          }
        }
      }
    }
  },
